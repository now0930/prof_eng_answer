name: validation

# Run tests only when explicitly requested after code changes are complete.
# Do not start Actions for push or pull_request events.
on:
  workflow_dispatch:
    inputs:
      run_s7_experiment:
        description: "Run optional offline S7 expert baseline (research only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python3 -m pip install pytest==8.4.2

      - name: Run offline pytest validation (owner-approved policy)
        env:
          VALIDATION_LIVE_API: "0"
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          CLOVA_API_KEY: ""
          QUALITATIVE_DE_MODE: "off"
          PROMOTE_GENERATED: "0"
        run: python3 -B scripts/release_candidate.py validate

      # Optional research is NOT a deployment/release gate. It never alters
      # A/B/C or approved Fact/Logic files, and outputs no answer text.
      - name: Optional S7 independent-claim review baseline (non-gating)
        if: ${{ inputs.run_s7_experiment }}
        continue-on-error: true
        env:
          VALIDATION_LIVE_API: "0"
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          CLOVA_API_KEY: ""
          QUALITATIVE_DE_MODE: "off"
          CLAIM_ALIGNMENT_MODE: "off"
        run: |
          python3 -B scripts/evaluate_claim_alignment_s7.py \
            --output "${RUNNER_TEMP}/claim_alignment_s7_experiment.json" || {
              echo "::warning::S7 research experiment incomplete. Check failure_details and candidate coverage in this step; release pytest has a separate status."
              exit 1
            }

