name: validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python3 -m pip install pytest==8.4.2

      - name: Run offline pytest validation (owner-approved policy)
        env:
          VALIDATION_LIVE_API: "0"
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          CLOVA_API_KEY: ""
          QUALITATIVE_DE_MODE: "off"
          PROMOTE_GENERATED: "0"
        run: python3 -B scripts/release_candidate.py validate

      - name: Ensure working tree code was not modified
        run: |
          git diff --check
          git diff --exit-code
