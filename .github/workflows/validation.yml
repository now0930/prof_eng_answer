name: validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# PR synchronize may fire after every commit. Keep only the newest validation
# for each PR; do not cancel explicitly requested manual runs or main pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify_changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      tests: ${{ steps.classify.outputs.tests }}
      topic_validation: ${{ steps.classify.outputs.topic_validation }}
    steps:
      - name: Checkout pull request history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files and select focused tests
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_ACTION: ${{ github.event.action }}
        run: python3 -B scripts/select_validation_tests.py

  documentation:
    needs: classify_changes
    if: github.event_name == 'pull_request' && needs.classify_changes.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check documentation diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check README and documentation contracts
        run: |
          python3 -B -m scripts.test_topic_pack_workflow_controller
          python3 -B -m scripts.test_verdict_recommendation_consistency

  validate:
    needs: classify_changes
    if: always() && (github.event_name != 'pull_request' || needs.classify_changes.outputs.mode != 'docs')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install release test runner
        run: python3 -m pip install pytest==8.4.2

      # PR development stays fast. This is NOT a release or production READY gate.
      - name: Validate CI script syntax
        run: |
          bash -n scripts/validate_release.sh
          python3 -B -m py_compile scripts/select_validation_tests.py

      - name: Run changed-area regressions
        if: github.event_name == 'pull_request' && needs.classify_changes.result == 'success' && needs.classify_changes.outputs.mode == 'focused'
        env:
          SELECTED_TESTS: ${{ needs.classify_changes.outputs.tests }}
        run: |
          read -r -a tests <<< "$SELECTED_TESTS"
          test "${#tests[@]}" -gt 0
          python3 -B -m pytest -q "${tests[@]}"

      - name: Verify changed Topic Pack contracts
        if: github.event_name == 'pull_request' && needs.classify_changes.outputs.mode == 'focused' && needs.classify_changes.outputs.topic_validation == 'true'
        run: |
          python3 -B scripts/rubric_manager.py validate-all
          python3 -B scripts/test_generated_rubrics_freshness.py

      # Manual dispatch or main push ALWAYS runs the unchanged full Release Gate.
      # PRs also run it for unknown/unclassified diffs and classifier failures.
      - name: Verify independent Fact Anchor hold policies
        if: github.event_name != 'pull_request' || needs.classify_changes.result != 'success' || needs.classify_changes.outputs.mode == 'full'
        run: python3 -B -m pytest -q tests/test_fact_anchor_scoring_exclusions.py tests/test_fact_anchor_independent_revision_holds.py tests/test_fact_anchor_unresolved_source_holds.py

      - name: Run full release validation
        if: github.event_name != 'pull_request' || needs.classify_changes.result != 'success' || needs.classify_changes.outputs.mode == 'full'
        run: PROMOTE_GENERATED=0 scripts/validate_release.sh

      - name: Verify committed Topic Pack banks match a fresh rebuild
        if: github.event_name != 'pull_request' || needs.classify_changes.result != 'success' || needs.classify_changes.outputs.mode == 'full'
        run: python3 -B scripts/test_generated_rubrics_freshness.py

      - name: Ensure generated files are committed
        run: |
          git diff --check
          git diff --exit-code
