name: validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run release validation
        run: PROMOTE_GENERATED=0 scripts/validate_release.sh

      - name: Verify committed Topic Pack banks match a fresh rebuild
        run: python3 -B scripts/test_generated_rubrics_freshness.py

      - name: Ensure generated files are committed
        run: |
          git diff --check
          git diff --exit-code
