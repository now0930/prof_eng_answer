name: validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  classify_changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          docs_only=true
          if [ -z "$files" ]; then
            docs_only=false
          fi
          while IFS= read -r file; do
            case "$file" in
              README.md)
                ;;
              docs/*)
                case "$file" in
                  docs/topic_sheets/*) docs_only=false ;;
                  *.md) ;;
                  *) docs_only=false ;;
                esac
                ;;
              *)
                docs_only=false
                ;;
            esac
          done <<< "$files"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  documentation:
    needs: classify_changes
    if: github.event_name == 'pull_request' && needs.classify_changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check documentation diff
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check README and documentation contracts
        run: |
          python3 -B -m scripts.test_topic_pack_workflow_controller
          python3 -B -m scripts.test_verdict_recommendation_consistency

  validate:
    needs: classify_changes
    if: always() && (github.event_name != 'pull_request' || needs.classify_changes.outputs.docs_only != 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run release validation
        run: PROMOTE_GENERATED=0 scripts/validate_release.sh

      - name: Verify committed Topic Pack banks match a fresh rebuild
        run: python3 -B scripts/test_generated_rubrics_freshness.py

      - name: Ensure generated files are committed
        run: |
          git diff --check
          git diff --exit-code
